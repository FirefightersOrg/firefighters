<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#1d3557" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#10203a" media="(prefers-color-scheme: dark)" />
		<title>Sin conexión - Firefighters</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #f7f7f5;
				color: #1a1d21;
				font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
			}
			main {
				max-width: 26rem;
				margin: 1rem;
				padding: 2rem;
				text-align: center;
				background: #fff;
				border: 1px solid #e2e8f0;
				border-radius: 0.75rem;
			}
			h1 {
				font-size: 1.5rem;
				margin: 0 0 0.5rem;
			}
			p {
				color: #64748b;
				line-height: 1.5;
				margin: 0 0 1.5rem;
			}
			button {
				background: #1d3557;
				color: #fff;
				border: 0;
				border-radius: 0.5rem;
				padding: 0.625rem 1.25rem;
				font-size: 1rem;
				font-weight: 600;
				cursor: pointer;
			}
			button:focus-visible {
				outline: 3px solid #f5c518;
				outline-offset: 2px;
			}
			/* Same values as the dark Cimiento tokens (this page cannot load tokens.css offline). */
			@media (prefers-color-scheme: dark) {
				body {
					background: #0f141b;
					color: #eceef1;
				}
				main {
					background: #171d26;
					border-color: #2a323e;
				}
				p {
					color: #a9b1bd;
				}
				button {
					background: #b9cbe6;
					color: #10203a;
				}
			}
		</style>
	</head>
	<body>
		<main role="alert">
			<h1>Sin conexión</h1>
			<p>
				No hay conexión a internet. Revisar la conexión e intentar de nuevo. Por seguridad, sin
				conexión no se pueden registrar pagos ni consultar datos.
			</p>
			<button type="button" onclick="location.reload()">Reintentar</button>
		</main>
	</body>
</html>
